# Prose gate. Runs over the reader-facing pages; see
# ci/workflows/docs.yml (staged) and docs/STYLE-GUIDE.md.
#
# Precedence, decided deliberately and recorded in the style guide:
#
#   house voice  ->  Google  ->  Vale defaults
#
# Google is the base for everything the house guide is silent on. Where
# the two collide the house voice wins, and every override below names
# its reason, so a reader who wonders why a Google rule is off finds the
# answer here rather than guessing it is an oversight.
#
# Every count in this file is what Vale reports on a clean run over the
# gated set: 435 alerts across 12 files. A rule demoted without that
# number reads later as an oversight and gets re-promoted by somebody
# repeating the work, and a number nothing re-measures goes stale the
# first time a page is edited. `node ts/scripts/vale-counts.cjs` checks
# every one of them against a live run, `--write` re-measures, and the
# docs workflow fails on drift.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Tabnas
# PINNED BY URL, not by name. `Packages = Google` resolves to whatever
# the registry serves at sync time, so a Google release could add an
# error-level rule and turn an unrelated docs pull request red.
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google, Tabnas

# --- Overrides where the house voice wins ------------------------------

# "We" is allowed in TUTORIALS ONLY (STYLE-GUIDE.md, voice rule 7). Vale
# cannot express that, so the restriction is carried by docs.test.js
# `we-appears-only-in-tutorials`, which knows which page is which.
# 2 hits, one in each runtime's tutorial.
Google.We = NO

# "I" appears nowhere, which is STRICTER than Google's rule.
# docs.test.js `first-person-singular-appears-nowhere` covers it. 0 hits.
Google.FirstPerson = NO

# British spellings. Google style is US English; the house voice is not,
# and the precedence above puts the house voice first. 0 hits.
# Real misspellings are still caught by Vale.Spelling, at error.
Google.Spelling = NO

# The house guide bans em dashes outright. Google's rule is about
# SPACING, which is redundant under a ban, and it cannot see the ones
# inside quoted output that the ban exempts. 92 in the gated set at
# the base commit, all rewritten in the pass that added this gate.
# The ban is carried by docs.test.js `no-em-dashes-in-prose`, over
# stripped prose.
# 0 hits.
Google.EmDash = NO

# The occasional passive keeps a sentence's subject on the thing being
# documented ("the token is discarded"). 99 hits. Advisory.
Google.Passive = suggestion

# Contractions are a register choice per document kind: tutorials
# contract, reference pages do not. 52 hits. Advisory.
Google.Contractions = suggestion

# Voice rule 4 rations parentheses more precisely than "use parentheses
# judiciously" can. 157 hits.
Google.Parens = suggestion

# A semicolon joining two independent clauses is part of the long
# explanatory sentence in voice rule 6. 64 hits.
Google.Semicolons = suggestion

# --- The gate ----------------------------------------------------------

Google.Latin = error
Google.Ellipses = error
Tabnas.WordChoice = error

# Vale's dictionary plus .vale/styles/config/vocabularies/Tabnas.
# 17 domain terms are accepted there by name; the next one is a
# typo until somebody adds it, which is the point of keeping this at
# error.
Vale.Spelling = error

# The banned list, read from reject.txt in the same vocabulary
# directory. ts/test/docs.test.js reads that identical file, so the two
# gates cannot disagree about what is banned. 0 hits.
Vale.Avoid = error

# --- Demoted on evidence, not on taste --------------------------------
#
# Each was tried at error level against the real pages first. The count
# is what it produced on a clean run.

# Wants an abbreviation spelled out on first use: the character names
# BOM, NUL, TAB, and NEL, the code point FEFF, ECMA, and MIT, all
# standard for this audience. 23 hits.
Google.Acronyms = warning

# Sentence case in headings. It cannot know that Go and Rust are proper
# nouns or that NUL is a character's name. 7 hits: five page titles end
# in (Go) or (Rust), one opens on NUL, and one is the reference entry
# "`Hoover` (Plugin)", whose capitalized label it reads as title case.
Google.Headings = warning

# Maps `terminate` to `stop`, `above` to `preceding`, and `touch` to
# `tap`, a mobile-UI rule. 6 hits, all `terminate`, said of a block
# reaching its end delimiter, for which it is the exact word. The one
# substitution that does hold is carried at error by Tabnas.WordChoice.
Google.WordListCase = warning

# US convention: commas and periods INSIDE the quotation marks. The
# house voice is not US English, and a period inside a quoted `code
# span` is actively wrong when the quote is a literal. 11 hits, each a
# quoted literal ("unset", "version", "skip") or a quoted phrase, with
# the punctuation outside by the house convention.
Google.Quotes = warning

# "Avoid the unverifiable claim 'guarantee'." 0 hits,
# and the subject matter is what a parser promises about a grammar.
Google.ExcessiveClaims = warning

# Fires on a colon followed by a proper noun. 2 hits, both TAB, the
# character's name.
Google.Colons = warning

# Serial commas, which the guide requires. 4 hits, none of them a
# missing serial comma: two two-item phrases after a comma ("internal
# spaces and newlines included", "including leading and trailing
# spaces") and the idiom "spaces and all", twice. The rule cannot tell
# any of those from a list.
Google.OxfordComma = warning

# Flags "sees" and "tells" as attributing human qualities to software,
# and cannot tell those from sentences about people. 0 hits.
Google.Anthropomorphism = warning

# "Use 'command-line tool' instead of 'CLI'." 0 hits. The
# audience runs the command-line tool and calls it a CLI.
Google.WordList = warning

# Flags an `-ly` adverb before a hyphen ("newly-created"), a real error
# class, but it cannot tell an adverb from a word that merely ends in
# those two letters. Genuine hits are fixed rather than excused.
# 0 hits.
Google.LyHyphens = warning

# "Don't use plurals in parentheses such as in 'tag(s)'." Where a
# reference page lists what an option accepts, the parenthetical plural
# is the shortest true statement. 4 hits, all `delimiter(s)` in the
# reference tables' rows for an option taking one delimiter or several.
Google.OptionalPlurals = warning

# "Put a nonbreaking space between the number and the unit." It cannot
# see that the number is inside a quoted literal. 1 hit, and it is not a
# measurement: the code point U+200B, whose hex digits end in B.
Google.Units = warning

# Wants a space inside what it reads as two words, and cannot tell that
# from a field selector inside a quoted code span.
# 0 hits.
Google.Spacing = warning

# "Avoid using 'will'." The future tense is what a page uses for a
# consequence that follows later. 4 hits, all in a tutorial's opening:
# the heading "What you will build" and the sentence under it, in each
# runtime's tutorial.
Google.Will = warning

# "Avoid time-based words like 'currently'." The word carries
# information when its subject is expected to change, such as a version
# or a limit named as temporary. 1 hit, "the rule the parser is
# currently in": a moment in a parse, not in the product's history.
Google.Timeless = warning
